<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risolutore Quiz Universitari di Statistica</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: var(--primary);
      border-bottom: 2px solid var(--bg);
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.95rem;
    }

    input[type="password"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    .drop-zone {
      border: 2px dashed var(--primary);
      border-radius: 10px;
      padding: 30px;
      text-align: center;
      background: #eff6ff;
      cursor: pointer;
      transition: background 0.2s;
    }

    .drop-zone:hover {
      background: #dbeafe;
    }

    .drop-zone p {
      margin: 0;
      color: var(--primary);
      font-weight: 500;
    }

    #fileInput {
      display: none;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 15px;
    }

    .preview-item {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #f1f5f9;
      text-align: center;
    }

    .preview-item img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }

    .preview-item span {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px;
      background: #fff;
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(220, 38, 38, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    button.submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.submit-btn:hover {
      background: var(--primary-hover);
    }

    button.submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .result-box {
      margin-top: 25px;
      padding: 20px;
      background: #f1f5f9;
      border-radius: 8px;
      border-left: 5px solid var(--success);
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .result-string {
      font-family: 'Courier New', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text);
      word-break: break-all;
      background: #fff;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .copy-btn {
      background: var(--success);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .loader {
      display: none;
      text-align: center;
      margin-top: 20px;
      font-weight: 600;
      color: var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Risolutore Quiz di Statistica (AI)</h1>

  <div class="form-group">
    <label for="apiKey">Google Gemini API Key</label>
    <input type="password" id="apiKey" placeholder="Incolla qui la tua API Key (AIzaSy...)">
  </div>

  <div class="form-group">
    <label for="modelSelect">Modello AI (consigliato Pro per calcoli complessi)</label>
    <select id="modelSelect">
      <option value="gemini-2.5-pro">Gemini 2.5 Pro (Massima precisione matematica)</option>
      <option value="gemini-2.5-flash">Gemini 2.5 Flash (Più veloce)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Immagini delle Domande (in ordine sequenziale)</label>
    <div class="drop-zone" id="dropZone">
      <p>Clicca qui o trascina le immagini delle domande (PNG, JPG, WEBP)</p>
      <input type="file" id="fileInput" multiple accept="image/*">
    </div>
    <div class="preview-grid" id="previewGrid"></div>
  </div>

  <button class="submit-btn" id="solveBtn">Analizza e Risolvi Quiz</button>

  <div class="loader" id="loader">
    Elaborazione statistica e verifica matematica in corso... Attendere.
  </div>

  <div class="result-box" id="resultBox">
    <div class="result-header">
      <strong>Risposte Esatte:</strong>
      <button class="copy-btn" id="copyBtn">Copia Risultato</button>
    </div>
    <div class="result-string" id="resultOutput"></div>
  </div>
</div>

<script>
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const previewGrid = document.getElementById('previewGrid');
  const solveBtn = document.getElementById('solveBtn');
  const loader = document.getElementById('loader');
  const resultBox = document.getElementById('resultBox');
  const resultOutput = document.getElementById('resultOutput');
  const copyBtn = document.getElementById('copyBtn');

  let selectedFiles = [];

  // Gestione click e drag-and-drop
  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.background = '#dbeafe';
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.style.background = '#eff6ff';
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.background = '#eff6ff';
    handleFiles(e.dataTransfer.files);
  });

  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
  });

  function handleFiles(files) {
    const newFiles = Array.from(files).filter(file => file.type.startsWith('image/'));
    selectedFiles = [...selectedFiles, ...newFiles];
    renderPreviews();
  }

  function removeFile(index) {
    selectedFiles.splice(index, 1);
    renderPreviews();
  }

  function renderPreviews() {
    previewGrid.innerHTML = '';
    selectedFiles.forEach((file, index) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const div = document.createElement('div');
        div.className = 'preview-item';
        div.innerHTML = `
          <button class="remove-btn" onclick="removeFile(${index})" title="Rimuovi">×</button>
          <img src="${e.target.result}" alt="Domanda ${index + 1}">
          <span>Domanda ${index + 1}</span>
        `;
        previewGrid.appendChild(div);
      };
      reader.readAsDataURL(file);
    });
  }

  // Converte file in Base64 per l'API di Gemini
  function fileToGenerativePart(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => {
        const base64Data = reader.result.split(',')[1];
        resolve({
          inlineData: {
            data: base64Data,
            mimeType: file.type
          }
        });
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Costruisce il prompt esatto richiesto
  function buildPrompt(numQuestions) {
    return `AGISCI COME UN DOCENTE UNIVERSITARIO DI STATISTICA,
LAUREATO IN STATISTICA, CON PREPARAZIONE AVANZATA
IN STATISTICA MATEMATICA, INFERENZA STATISTICA,
PROBABILITA', ECONOMETRIA E ANALISI DEI DATI.

Il tuo compito è risolvere quiz universitari a risposta
multipla con la MASSIMA PRECISIONE POSSIBILE.

OBIETTIVO:
Non devi rispondere velocemente sacrificando la precisione.
Devi individuare la risposta scientificamente e
matematicamente corretta.

PROCEDURA OBBLIGATORIA PER OGNI DOMANDA:

1. Leggi integralmente il testo della domanda.
2. Analizza tutte le alternative A, B, C e D.
3. Identifica l'argomento statistico specifico.
4. Individua la definizione, la formula o il teorema
   pertinente.
5. Se la domanda contiene calcoli:
   - individua i dati;
   - applica la formula corretta;
   - verifica i passaggi matematici;
   - controlla il risultato numerico;
   - considera eventuali arrotondamenti.
6. Se la domanda riguarda una definizione:
   - distingui i concetti simili;
   - verifica le condizioni di validità;
   - non confondere termini statistici.
7. Esamina tutte le alternative.
8. Elimina le risposte errate e individua quella corretta.
9. Esegui una seconda verifica indipendente della risposta.
10. Prima di confermare, verifica che la risposta scelta
    corrisponda esattamente all'alternativa indicata.

ATTENZIONE AI TRANELLI:

- Confusione tra media, mediana e moda.
- Confusione tra varianza e deviazione standard.
- Confusione tra probabilità condizionata e indipendenza.
- Confusione tra correlazione e causalità.
- Confusione tra ipotesi nulla e alternativa.
- Confusione tra errore di I tipo e II tipo.
- Confusione tra campione e popolazione.
- Confusione tra stimatore e stima.
- Confusione tra distribuzioni statistiche.
- Formule con denominatori differenti.
- Segni, unità di misura e arrotondamenti.
- Alternative quasi identiche.
- Definizioni formulate in modo ingannevole.

REGOLE:

- Non scegliere una risposta soltanto perché sembra plausibile.
- Non inventare dati mancanti.
- Non ignorare nessuna alternativa.
- Non rispondere prima di aver verificato.
- Se una domanda è ambigua o illeggibile,
  non inventare una soluzione.
- Ogni immagine corrisponde a una domanda.
- Mantieni l'ordine originale delle immagini.

VERIFICA FINALE:

Controlla nuovamente tutte le domande.
Verifica la correttezza matematica e concettuale.
Verifica che nessuna risposta sia stata associata
alla domanda sbagliata.
Verifica il numero totale delle risposte.

FORMATO DI OUTPUT OBBLIGATORIO:

1:A;2:C;3:B;4:D

Restituisci ESCLUSIVAMENTE la stringa delle risposte.
Nessuna spiegazione.
Nessun commento.
Nessun testo aggiuntivo.

Numero di domande: ${numQuestions}`;
  }

  solveBtn.addEventListener('click', async () => {
    const apiKey = document.getElementById('apiKey').value.trim();
    const model = document.getElementById('modelSelect').value;

    if (!apiKey) {
      alert('Inserisci la tua Google Gemini API Key.');
      return;
    }

    if (selectedFiles.length === 0) {
      alert('Carica almeno un\'immagine contenente una domanda.');
      return;
    }

    solveBtn.disabled = true;
    loader.style.display = 'block';
    resultBox.style.display = 'none';

    try {
      const promptText = buildPrompt(selectedFiles.length);
      const imageParts = await Promise.all(selectedFiles.map(fileToGenerativePart));

      const requestBody = {
        contents: [
          {
            parts: [
              { text: promptText },
              ...imageParts
            ]
          }
        ],
        generationConfig: {
          temperature: 0.1 // Bassa temperatura per massimo rigore analitico
        }
      };

      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || 'Errore durante la chiamata API');
      }

      const answerText = data.candidates[0].content.parts[0].text.trim();
      resultOutput.textContent = answerText;
      resultBox.style.display = 'block';

    } catch (error) {
      alert('Errore: ' + error.message);
    } finally {
      solveBtn.disabled = false;
      loader.style.display = 'none';
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(resultOutput.textContent);
    copyBtn.textContent = 'Copiato!';
    setTimeout(() => copyBtn.textContent = 'Copia Risultato', 2000);
  });
</script>

</body>
</html>
